<!doctype html>
<html lang='de'>

<head>
  <meta charset='utf-8' />
  <meta name='description' content='SculptIt - digitales Kneten im Browser'>
  <meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no'>
  <meta name='mobile-web-app-capable' content='yes'>
  <meta name='apple-mobile-web-app-capable' content='yes'>

  <title>SculptIt</title>

  <link rel='stylesheet' href='css/sculptit.css' type='text/css' />

  <script>
  'use strict';
  window.addEventListener('load', function () {
    var app = window.sculptit = new window.SculptIt(); // sculptit: Debug-Zugriff
    app.start();
  });
  </script>
</head>

<body oncontextmenu='return false;'>
  <input type='file' id='fileopen' multiple style='display: none' />
  <input type='file' id='backgroundopen' style='display: none' />
  <input type='file' id='alphaopen' style='display: none' />
  <input type='file' id='textureopen' style='display: none' />
  <input type='file' id='matcapopen' style='display: none' />

  <div id='viewport'>
    <canvas id='canvas'></canvas>
  </div>

  <script src='sculptit.js'></script>
</body>

</html>
